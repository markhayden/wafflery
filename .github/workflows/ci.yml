name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Full check matrix (macOS 15)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CI: "true"
      CARGO_TERM_COLOR: always
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.13.1"
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.3"

      - name: Cache Bun packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.bun/install/cache
          key: bun-macos15-${{ runner.arch }}-1.4.3-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-macos15-${{ runner.arch }}-1.4.3-

      - name: Install locked UI dependencies
        run: bun install --cwd ui --frozen-lockfile

      - name: Install the declared Rust toolchain
        run: |
          toolchain=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
          rustc --version
          cargo --version

      - name: Cache Cargo downloads and builds
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-macos15-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: cargo-macos15-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}-

      # Check before test:browser can regenerate the embedded assets.
      - name: Verify checked-in UI assets and reproducibility
        run: bun run scripts/check-ui.ts

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint Rust
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust
        run: cargo test --locked --all-targets

      - name: Typecheck UI and scripts
        run: bun run --cwd ui typecheck

      - name: Test UI and asset tooling
        run: |
          bun run --cwd ui test:unit
          bun test scripts/ui-manifest.test.ts

      - name: Build Storybook
        run: bun run --cwd ui build:storybook

      - name: Install Playwright browsers
        working-directory: ui
        run: bunx playwright install --with-deps chromium webkit

      - name: Test Chromium and WebKit
        id: browser
        run: bun run --cwd ui test:browser

      - name: Preserve failed browser diagnostics
        if: ${{ failure() && steps.browser.outcome == 'failure' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failures-${{ github.run_attempt }}
          path: |
            ui/test-results/**/trace.zip
            ui/test-results/**/test-failed-*.png
            ui/test-results/**/error-context.md
            ui/test-results/**/attempt-state-before-shutdown.ndjson
          retention-days: 3
          if-no-files-found: warn

      - name: Build release binary
        run: cargo build --locked --release --bin wafflery

      - name: Verify generated files stayed unchanged
        run: git diff --exit-code -- Cargo.lock ui/bun.lock ui/prebuilt
