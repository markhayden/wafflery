[package]
name = "wafflery"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "A local workshop for visual pipeline tools"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process", "fs"] }
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
nix = { version = "=0.31.3", features = ["user", "process", "fs", "event", "signal"] }
getrandom = "=0.4.3"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
thiserror = "=2.0.21"
tempfile = "=3.27.0"
png = "=0.18.1"
jpeg-decoder = { version = "=0.3.2", default-features = false }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

rmcp = { version = "=3.8.0", default-features = false, features = ["client", "transport-async-rw"] }
table-manners = "=0.4.0"
jsonschema = { version = "=0.60.2", default-features = false }
url = "=2.5.8"

base64 = "=0.22.1"

futures-util = "=0.3.34"
tar = { version = "=0.4.46", default-features = false }
flate2 = "=1.1.10"

time = { version = "=0.3.47", features = ["formatting", "parsing"] }

[build-dependencies]
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tower = { version = "=0.5.3", features = ["util"] }
crc32fast = "=1.5.3"

[[example]]
name = "sample-lab"
path = "testkit/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[[example]]
name = "image-import-bench"
path = "testkit/image_import_bench.rs"
