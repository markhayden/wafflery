[package]
name = "wafflehouse"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "A local workshop for visual pipeline tools"

[dependencies]
axum = "=0.8.9"
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
nix = { version = "=0.31.3", features = ["user", "process", "fs"] }
getrandom = "=0.4.3"
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }
thiserror = "=2.0.21"
tempfile = "=3.27.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }

[build-dependencies]
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[dev-dependencies]
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tower = { version = "=0.5.3", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
